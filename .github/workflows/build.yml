# Cute Fetcher — build Android (debug/release) + rilis GitHub.
# Dasar: langkah ffmpeg + android dari release.yml YMusic (salinan referensi: docs_referensi/).
# Belum pernah dijalankan; jika merah, kirim log langkah yang gagal.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FFMPEG_BUILD_REPO: ymusic-io/ffmpeg-build
  FFMPEG_BUILD_REF: d0a89492c442dbca24dfabd044b866299f0a97b1
  NDK_VERSION: 28.2.13676358

jobs:
  # Pack ffmpeg per ABI (berat; di-cache per ref + NDK). Dibaca Gradle dari ../ffmpeg-build/out/<slug>.
  ffmpeg:
    name: ffmpeg ${{ matrix.slug }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        slug: [android-armeabi-v7a, android-arm64-v8a, android-x86, android-x86_64]
    steps:
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/${{ matrix.slug }}
          key: ffmpeg-${{ matrix.slug }}-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.FFMPEG_BUILD_REPO }}
          ref: ${{ env.FFMPEG_BUILD_REF }}
          path: ffmpeg-build
          submodules: recursive
          fetch-depth: 1

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build ffmpeg pack
        working-directory: ffmpeg-build
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          sudo apt-get update && sudo apt-get install -y nasm automake autoconf libtool pkg-config patchelf
          scripts/build-android.sh "${SLUG#android-}" || {
            for log in .deps-$SLUG/.build/*/config.log; do
              [ -f "$log" ] && { echo "::group::$log"; tail -n 80 "$log"; echo "::endgroup::"; }
            done
            exit 1
          }

  android:
    needs: ffmpeg
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.CUTE_KEYSTORE_BASE64 != '' }}
    steps:
      # Berdampingan: CuteFetcher/ + ffmpeg-build/ (Gradle membaca ../ffmpeg-build/out/<slug>).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: CuteFetcher

      - name: Restore ffmpeg android-armeabi-v7a
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/android-armeabi-v7a
          key: ffmpeg-android-armeabi-v7a-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
          fail-on-cache-miss: true
      - name: Restore ffmpeg android-arm64-v8a
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/android-arm64-v8a
          key: ffmpeg-android-arm64-v8a-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
          fail-on-cache-miss: true
      - name: Restore ffmpeg android-x86
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/android-x86
          key: ffmpeg-android-x86-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
          fail-on-cache-miss: true
      - name: Restore ffmpeg android-x86_64
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ffmpeg-build/out/android-x86_64
          key: ffmpeg-android-x86_64-${{ env.FFMPEG_BUILD_REF }}-ndk${{ env.NDK_VERSION }}
          fail-on-cache-miss: true

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # Keystore dari GitHub Secrets (tidak pernah disimpan di repo). Tanpa secret: APK rilis
      # ditandatangani debug (hanya untuk uji, bukan untuk dibagikan).
      - name: Siapkan keystore
        if: env.HAS_KEYSTORE == 'true'
        working-directory: CuteFetcher
        env:
          KS_B64: ${{ secrets.CUTE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p signing
          echo "$KS_B64" | base64 -d > signing/release.jks
          echo "YMUSIC_ANDROID_STORE_FILE=signing/release.jks" >> "$GITHUB_ENV"
          echo "YMUSIC_ANDROID_STORE_PASSWORD=${{ secrets.CUTE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "YMUSIC_ANDROID_KEY_ALIAS=${{ secrets.CUTE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "YMUSIC_ANDROID_KEY_PASSWORD=${{ secrets.CUTE_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Validasi proyek
        working-directory: CuteFetcher
        run: ./gradlew --no-daemon help

      # Uji unit modul yang tidak bergantung pada pack ffmpeg host. Belum terbukti hijau,
      # jadi sementara tidak menggagalkan build; laporan selalu diunggah. Jadikan ketat setelah hijau.
      - name: Uji unit
        continue-on-error: true
        working-directory: CuteFetcher
        run: >-
          ./gradlew --continue -Pci=true
          :kmpCommon:jvmTest :projectCommon:jvmTest :settings:jvmTest :media-store:jvmTest

      - name: Build APK
        working-directory: CuteFetcher
        run: ./gradlew -Pproduction=true :androidApp:assembleRelease :engine-js:closureJs :engine-js:closurePlayerJs

      - name: Hapus keystore
        if: always()
        working-directory: CuteFetcher
        run: rm -rf signing

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: laporan-uji
          path: CuteFetcher/**/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cute-fetcher-apk
          path: CuteFetcher/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  rilis:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cute-fetcher-apk
          path: apk
      - name: Buat rilis (draf) dan unggah APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la apk
          # SHA256SUMS.txt: cadangan hash untuk updater (GitHub juga menyertakan digest tiap aset).
          (cd apk && sha256sum -- *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Draf: periksa lalu "Publish release" secara manual. Updater hanya melihat rilis yang sudah dipublikasikan.
          gh release create "$TAG" apk/*.apk apk/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --draft --title "Cute Fetcher $TAG" --generate-notes
